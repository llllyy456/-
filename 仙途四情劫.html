<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仙途</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height: 100%; }
body {
  font-family: "Noto Serif SC", "Songti SC", "STSong", "Microsoft YaHei", serif;
  background: #050308;
  color: #e8e0d0;
  min-height: 100vh;
  overflow: hidden;
  position: relative;
}

/* ==================== 背景层 ==================== */
#bg-layer {
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(ellipse at 50% 20%, rgba(40, 30, 60, 0.4) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 30%, #1a1428 0%, #0a0a12 60%, #050508 100%);
  z-index: 0;
  transition: background 1.5s ease;
}
#bg-layer.chapter1 { 
  background: 
    radial-gradient(ellipse at 50% 20%, rgba(60, 100, 60, 0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 30%, #1a2a1a 0%, #0a1a0a 60%, #050a05 100%);
}
#bg-layer.chapter2 { 
  background: 
    radial-gradient(ellipse at 50% 20%, rgba(120, 50, 50, 0.18) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 30%, #2a1a1a 0%, #1a0a0a 60%, #0a0505 100%);
}
#bg-layer.chapter3 { 
  background: 
    radial-gradient(ellipse at 50% 20%, rgba(120, 50, 120, 0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 30%, #2a1a2a 0%, #1a0a1a 60%, #0a050a 100%);
}
#bg-layer.chapter4 { 
  background: 
    radial-gradient(ellipse at 50% 20%, rgba(50, 80, 140, 0.18) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 30%, #1a1a2a 0%, #0a0a1a 60%, #05050a 100%);
}
#bg-layer.chapter5 { 
  background: 
    radial-gradient(ellipse at 50% 20%, rgba(140, 120, 50, 0.2) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 30%, #2a2a1a 0%, #1a1a0a 60%, #0a0a05 100%);
}

/* 飘落花瓣 */
.petal {
  position: fixed;
  z-index: 2;
  pointer-events: none;
  opacity: 0;
  font-size: 14px;
  color: rgba(240, 200, 200, 0.5);
  animation: petalFall 12s linear infinite;
  text-shadow: 0 0 8px rgba(240, 180, 200, 0.4);
}
@keyframes petalFall {
  0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
  10% { opacity: 0.7; }
  90% { opacity: 0.7; }
  100% { transform: translateY(110vh) translateX(80px) rotate(360deg); opacity: 0; }
}

/* 星辰 */
.star {
  position: fixed;
  width: 2px; height: 2px;
  background: #fff;
  border-radius: 50%;
  opacity: 0.3;
  animation: twinkle 3s infinite;
  z-index: 1;
  box-shadow: 0 0 4px rgba(255,255,255,0.6);
}
@keyframes twinkle {
  0%, 100% { opacity: 0.1; transform: scale(0.8); }
  50% { opacity: 0.8; transform: scale(1.2); }
}

/* ==================== 游戏主体 ==================== */
#game {
  position: relative;
  z-index: 10;
  max-width: 920px;
  margin: 0 auto;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 18px 20px;
}

/* 状态栏 */
#status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 22px;
  background: linear-gradient(180deg, rgba(25, 18, 38, 0.85), rgba(15, 10, 25, 0.85));
  border: 1px solid rgba(180, 150, 100, 0.25);
  border-radius: 10px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  margin-bottom: 14px;
  flex-wrap: wrap;
  gap: 12px;
  position: relative;
  box-shadow: 
    0 4px 20px rgba(0,0,0,0.4),
    inset 0 1px 0 rgba(220, 190, 130, 0.08);
}
#status-bar::before, #status-bar::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 6px;
  height: 6px;
  background: #d0b080;
  border-radius: 50%;
  transform: translateY(-50%);
  box-shadow: 0 0 8px rgba(208, 176, 128, 0.6);
}
#status-bar::before { left: 8px; }
#status-bar::after { right: 8px; }

#chapter-title {
  font-size: 15px;
  color: #d0b080;
  letter-spacing: 4px;
  font-weight: 500;
  text-shadow: 0 0 8px rgba(208, 176, 128, 0.3);
  padding-left: 14px;
}
#affection-panel {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  padding-right: 14px;
}
.aff-item {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  transition: transform 0.3s ease;
}
.aff-item:hover { transform: translateY(-2px); }
.aff-name { 
  color: #a09070; 
  letter-spacing: 1px;
}
.aff-bar {
  width: 64px;
  height: 7px;
  background: rgba(255,255,255,0.08);
  border-radius: 4px;
  overflow: hidden;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
  position: relative;
}
.aff-fill {
  height: 100%;
  width: 0%;
  border-radius: 4px;
  transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  box-shadow: 0 0 6px currentColor;
}
.aff-fill::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  animation: shimmer 2.5s linear infinite;
}
@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(200%); }
}
.aff-fill.shenhuaizhou { background: linear-gradient(90deg, #e8c8a0, #f0e0c0); color: #f0d0a0; }
.aff-fill.lihanyuan { background: linear-gradient(90deg, #c04040, #e06060); color: #e06060; }
.aff-fill.rongzhao { background: linear-gradient(90deg, #6090c0, #90c0e0); color: #90c0e0; }
.aff-fill.muchangli { background: linear-gradient(90deg, #b090d0, #d0b0e0); color: #d0b0e0; }
.aff-value { 
  color: #d0c0a0; 
  min-width: 22px; 
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* 文本区 */
#text-area {
  flex: 1;
  overflow-y: auto;
  padding: 36px 40px;
  background: 
    linear-gradient(180deg, rgba(20, 15, 32, 0.75), rgba(12, 8, 22, 0.75));
  border: 1px solid rgba(180, 150, 100, 0.2);
  border-radius: 14px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  margin-bottom: 14px;
  line-height: 2.1;
  font-size: 16px;
  scroll-behavior: smooth;
  position: relative;
  box-shadow: 
    0 8px 32px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(220, 190, 130, 0.06);
}
/* 四角装饰 */
#text-area::before, #text-area::after {
  content: "";
  position: absolute;
  width: 24px;
  height: 24px;
  border: 1px solid rgba(200, 170, 110, 0.4);
  pointer-events: none;
}
#text-area::before { top: 8px; left: 8px; border-right: none; border-bottom: none; }
#text-area::after { bottom: 8px; right: 8px; border-left: none; border-top: none; }

#text-area::-webkit-scrollbar { width: 6px; }
#text-area::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
#text-area::-webkit-scrollbar-thumb { 
  background: linear-gradient(180deg, rgba(208, 176, 128, 0.5), rgba(160, 128, 80, 0.5));
  border-radius: 3px; 
}
#text-area::-webkit-scrollbar-thumb:hover { 
  background: linear-gradient(180deg, rgba(208, 176, 128, 0.7), rgba(160, 128, 80, 0.7));
}

.text-line {
  margin-bottom: 18px;
  animation: fadeIn 0.9s cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); filter: blur(2px); }
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}

.narration { color: #b0a890; font-style: italic; }
.dialogue { color: #e8e0d0; }
.dialogue .speaker { 
  color: #d0b080; 
  font-weight: bold; 
  margin-right: 10px;
  text-shadow: 0 0 6px currentColor;
}
.dialogue.shenhuaizhou .speaker { color: #f0d0a0; }
.dialogue.lihanyuan .speaker { color: #e06060; }
.dialogue.rongzhao .speaker { color: #90c0e0; }
.dialogue.muchangli .speaker { color: #d0b0e0; }
.thought { color: #9080a0; font-style: italic; }
.highlight { color: #f0d080; font-weight: bold; text-shadow: 0 0 8px rgba(240, 208, 128, 0.4); }

/* 选项按钮 */
#choices {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: 10px;
}
.choice-btn {
  padding: 16px 26px 16px 30px;
  background: linear-gradient(90deg, rgba(25, 20, 40, 0.85), rgba(18, 14, 30, 0.85));
  border: 1px solid rgba(180, 150, 100, 0.3);
  border-radius: 10px;
  color: #d8d0c0;
  font-family: inherit;
  font-size: 15px;
  line-height: 1.7;
  text-align: left;
  cursor: pointer;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  position: relative;
  overflow: hidden;
  letter-spacing: 0.5px;
}
.choice-btn::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, #f0d080, #c0a060, #806030);
  opacity: 0;
  transition: opacity 0.3s;
  box-shadow: 0 0 10px rgba(240, 208, 128, 0.5);
}
.choice-btn::after {
  content: "";
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(240, 208, 128, 0.1), transparent);
  transition: left 0.6s ease;
}
.choice-btn:hover {
  background: linear-gradient(90deg, rgba(45, 35, 60, 0.95), rgba(30, 22, 45, 0.95));
  border-color: rgba(240, 208, 128, 0.6);
  color: #f0e8d8;
  transform: translateX(8px);
  box-shadow: 
    0 6px 24px rgba(0,0,0,0.5),
    0 0 20px rgba(180, 150, 100, 0.2);
}
.choice-btn:hover::before { opacity: 1; }
.choice-btn:hover::after { left: 100%; }
.choice-btn:active { transform: translateX(4px) scale(0.99); }

/* ==================== 开始屏 ==================== */
#start-screen {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: 
    radial-gradient(ellipse at 50% 40%, rgba(40, 30, 60, 0.4) 0%, transparent 60%),
    radial-gradient(ellipse at 50% 40%, #1a1428 0%, #0a0a12 70%);
  text-align: center;
  padding: 20px;
}
#start-screen::before {
  content: "";
  position: absolute;
  inset: 40px;
  border: 1px solid rgba(180, 150, 100, 0.15);
  border-radius: 8px;
  pointer-events: none;
}
#start-screen::after {
  content: "";
  position: absolute;
  inset: 46px;
  border: 1px solid rgba(180, 150, 100, 0.08);
  border-radius: 6px;
  pointer-events: none;
}
#start-screen h1 {
  font-size: clamp(40px, 9vw, 80px);
  color: #e8d0a0;
  letter-spacing: 16px;
  margin-bottom: 16px;
  text-shadow: 
    0 0 40px rgba(220, 190, 130, 0.4),
    0 0 80px rgba(220, 190, 130, 0.2);
  font-weight: 400;
  position: relative;
  z-index: 1;
  animation: titleGlow 4s ease-in-out infinite;
}
@keyframes titleGlow {
  0%, 100% { text-shadow: 0 0 40px rgba(220, 190, 130, 0.4), 0 0 80px rgba(220, 190, 130, 0.2); }
  50% { text-shadow: 0 0 50px rgba(240, 208, 128, 0.6), 0 0 100px rgba(220, 190, 130, 0.3); }
}
#start-screen .quote {
  font-size: 15px;
  color: #908070;
  font-style: italic;
  margin-bottom: 56px;
  max-width: 500px;
  line-height: 2.2;
  position: relative;
  z-index: 1;
  letter-spacing: 2px;
}
#start-screen .quote::before, 
#start-screen .quote::after {
  display: block;
  width: 60px;
  height: 1px;
  margin: 20px auto;
  background: linear-gradient(90deg, transparent, rgba(180, 150, 100, 0.4), transparent);
  content: "";
}
.start-btn {
  padding: 16px 64px;
  background: transparent;
  border: 1px solid rgba(200, 170, 110, 0.5);
  border-radius: 40px;
  color: #e0d0b0;
  font-family: inherit;
  font-size: 18px;
  letter-spacing: 8px;
  cursor: pointer;
  transition: all 0.4s ease;
  position: relative;
  z-index: 1;
  overflow: hidden;
}
.start-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(240, 208, 128, 0.15), transparent 70%);
  opacity: 0;
  transition: opacity 0.4s;
}
.start-btn:hover {
  background: rgba(200, 170, 110, 0.08);
  border-color: rgba(240, 208, 128, 0.7);
  box-shadow: 
    0 0 30px rgba(200, 170, 110, 0.25),
    inset 0 0 20px rgba(200, 170, 110, 0.1);
  letter-spacing: 12px;
  color: #f0e0c0;
}
.start-btn:hover::before { opacity: 1; }

/* ==================== 结局屏 ==================== */
#ending-screen {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: 
    radial-gradient(ellipse at 50% 40%, rgba(40, 30, 60, 0.4) 0%, transparent 60%),
    radial-gradient(ellipse at 50% 40%, #1a1428 0%, #0a0a12 70%);
  text-align: center;
  padding: 50px 20px;
  overflow-y: auto;
}
#ending-screen::before {
  content: "";
  position: absolute;
  inset: 30px;
  border: 1px solid rgba(180, 150, 100, 0.2);
  border-radius: 8px;
  pointer-events: none;
}
#ending-screen h2 {
  font-size: clamp(30px, 6.5vw, 52px);
  color: #e8d0a0;
  letter-spacing: 10px;
  margin-bottom: 36px;
  text-shadow: 
    0 0 30px rgba(220, 190, 130, 0.4),
    0 0 60px rgba(220, 190, 130, 0.2);
  font-weight: 400;
  animation: titleGlow 4s ease-in-out infinite;
  position: relative;
  z-index: 1;
}
#ending-screen .ending-text {
  font-size: 16px;
  color: #c0b8a8;
  line-height: 2.3;
  max-width: 620px;
  margin-bottom: 44px;
  text-align: left;
  padding: 30px 36px;
  background: rgba(15, 12, 25, 0.5);
  border: 1px solid rgba(180, 150, 100, 0.15);
  border-radius: 10px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  position: relative;
  z-index: 1;
  box-shadow: inset 0 1px 0 rgba(220, 190, 130, 0.05);
}
#ending-screen .ending-text p { margin-bottom: 16px; }
#ending-screen .ending-text p:last-child { margin-bottom: 0; }
.restart-btn {
  padding: 14px 54px;
  background: transparent;
  border: 1px solid rgba(200, 170, 110, 0.5);
  border-radius: 40px;
  color: #e0d0b0;
  font-family: inherit;
  font-size: 16px;
  letter-spacing: 5px;
  cursor: pointer;
  transition: all 0.4s ease;
  position: relative;
  z-index: 1;
}
.restart-btn:hover {
  background: rgba(200, 170, 110, 0.1);
  border-color: rgba(240, 208, 128, 0.7);
  box-shadow: 
    0 0 30px rgba(200, 170, 110, 0.25),
    inset 0 0 20px rgba(200, 170, 110, 0.1);
  color: #f0e0c0;
  letter-spacing: 8px;
}

/* ==================== 好感度弹出 ==================== */
.aff-popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 14px 32px;
  background: linear-gradient(135deg, rgba(25, 18, 38, 0.95), rgba(15, 10, 25, 0.95));
  border: 1px solid rgba(240, 208, 128, 0.5);
  border-radius: 30px;
  color: #f0d080;
  font-size: 16px;
  letter-spacing: 2px;
  z-index: 150;
  animation: popupFade 2s ease forwards;
  pointer-events: none;
  box-shadow: 
    0 0 30px rgba(240, 208, 128, 0.3),
    inset 0 1px 0 rgba(240, 208, 128, 0.2);
  text-shadow: 0 0 8px rgba(240, 208, 128, 0.5);
}
@keyframes popupFade {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
  20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -65%) scale(1); }
}

/* 名字输入框 */
#name-input {
  background: transparent !important;
  border: none !important;
  border-bottom: 1px solid rgba(200, 170, 110, 0.6) !important;
  color: #f0d080 !important;
  font-family: inherit !important;
  font-size: 18px !important;
  padding: 6px 10px !important;
  outline: none !important;
  width: 160px !important;
  text-align: center !important;
  letter-spacing: 2px;
  text-shadow: 0 0 8px rgba(240, 208, 128, 0.3);
  transition: all 0.3s;
}
#name-input:focus {
  border-bottom-color: rgba(240, 208, 128, 0.9) !important;
  box-shadow: 0 4px 12px -6px rgba(240, 208, 128, 0.5);
}
#name-input::placeholder { color: rgba(160, 144, 112, 0.5); }

@media (max-width: 600px) {
  #game { padding: 10px; }
  #text-area { padding: 24px 22px; font-size: 15px; }
  .choice-btn { padding: 14px 20px 14px 24px; font-size: 14px; }
  #status-bar { padding: 10px 16px; }
  .aff-bar { width: 44px; }
  #chapter-title { font-size: 13px; letter-spacing: 2px; }
  #start-screen h1 { letter-spacing: 10px; }
  #ending-screen .ending-text { padding: 20px; font-size: 15px; }
}
</style>
</head>
<body>

<div id="bg-layer"></div>

<div id="start-screen">
  <h1>仙途</h1>
  <div class="quote">
    正道非正，魔道非恶。<br>
    妖亦有情，仙亦有私。<br>
    你，会选谁？
  </div>
  <button class="start-btn" onclick="startGame()">开 始</button>
</div>

<div id="game" style="display:none;">
  <div id="status-bar">
    <div id="chapter-title">第一章 · 初入昆仑</div>
    <div id="affection-panel">
      <div class="aff-item">
        <span class="aff-name">怀舟</span>
        <div class="aff-bar"><div class="aff-fill shenhuaizhou" id="aff-shenhuaizhou"></div></div>
        <span class="aff-value" id="val-shenhuaizhou">0</span>
      </div>
      <div class="aff-item">
        <span class="aff-name">寒渊</span>
        <div class="aff-bar"><div class="aff-fill lihanyuan" id="aff-lihanyuan"></div></div>
        <span class="aff-value" id="val-lihanyuan">0</span>
      </div>
      <div class="aff-item">
        <span class="aff-name">容昭</span>
        <div class="aff-bar"><div class="aff-fill rongzhao" id="aff-rongzhao"></div></div>
        <span class="aff-value" id="val-rongzhao">0</span>
      </div>
      <div class="aff-item">
        <span class="aff-name">长离</span>
        <div class="aff-bar"><div class="aff-fill muchangli" id="aff-muchangli"></div></div>
        <span class="aff-value" id="val-muchangli">0</span>
      </div>
    </div>
  </div>
  <div id="text-area"></div>
  <div id="choices"></div>
</div>

<div id="ending-screen">
  <h2 id="ending-title"></h2>
  <div class="ending-text" id="ending-text"></div>
  <button class="restart-btn" onclick="restartGame()">重 新 开 始</button>
</div>

<script>
// ==================== 游戏状态 ====================
let state = {
  affection: { shenhuaizhou: 0, lihanyuan: 0, rongzhao: 0, muchangli: 0 },
  flags: {},
  chapter: 1,
  playerName: ''
};

// ==================== 好感度显示 ====================
function updateAffectionUI() {
  const names = ['shenhuaizhou', 'lihanyuan', 'rongzhao', 'muchangli'];
  names.forEach(n => {
    const val = state.affection[n];
    document.getElementById('aff-' + n).style.width = Math.min(val, 100) + '%';
    document.getElementById('val-' + n).textContent = val;
  });
}

function changeAffection(name, amount) {
  const before = state.affection[name];
  state.affection[name] = Math.max(0, Math.min(100, state.affection[name] + amount));
  const actual = state.affection[name] - before;
  updateAffectionUI();
  if (actual > 0) {
    const labels = { shenhuaizhou: '沈怀舟', lihanyuan: '厉寒渊', rongzhao: '容昭', muchangli: '慕长离' };
    showAffPopup(labels[name] + ' 好感 +' + actual);
  }
}

function showAffPopup(text) {
  const popup = document.createElement('div');
  popup.className = 'aff-popup';
  popup.textContent = text;
  document.body.appendChild(popup);
  setTimeout(() => popup.remove(), 2000);
}

// ==================== 文本渲染 ====================
function clearText() {
  document.getElementById('text-area').innerHTML = '';
  document.getElementById('choices').innerHTML = '';
}

function addText(html, className = '') {
  const area = document.getElementById('text-area');
  const div = document.createElement('div');
  div.className = 'text-line ' + className;
  div.innerHTML = html;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function addNarration(text) { addText(text, 'narration'); }
function addDialogue(speaker, text, charClass = '') {
  addText(`<span class="speaker">${speaker}</span>「${text}」`, 'dialogue ' + charClass);
}
function addThought(text) { addText('（' + text + '）', 'thought'); }

function showChoices(choices) {
  const container = document.getElementById('choices');
  container.innerHTML = '';
  choices.forEach((c) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.text;
    btn.onclick = () => {
      container.innerHTML = '';
      if (c.result) addNarration('▸ ' + c.result);
      if (c.effect) c.effect();
      setTimeout(() => { c.next(); }, c.delay || 800);
    };
    container.appendChild(btn);
  });
}

function setChapterBg(ch) {
  const bg = document.getElementById('bg-layer');
  bg.className = '';
  if (ch >= 1 && ch <= 5) bg.classList.add('chapter' + ch);
  document.getElementById('chapter-title').textContent = 
    ['', '第一章 · 初入昆仑', '第二章 · 宗门禁忌', '第三章 · 入世历练', '第四章 · 秘境迷渊', '第五章 · 三界动荡'][ch] || '';
}

function createStars() {
  for (let i = 0; i < 50; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    star.style.width = star.style.height = (Math.random() * 2 + 1) + 'px';
    document.body.appendChild(star);
  }
}

function createPetals() {
  const petalChars = ['❀', '✿', '❁', '✾'];
  for (let i = 0; i < 12; i++) {
    const petal = document.createElement('div');
    petal.className = 'petal';
    petal.textContent = petalChars[Math.floor(Math.random() * petalChars.length)];
    petal.style.left = Math.random() * 100 + '%';
    petal.style.animationDelay = (Math.random() * 12) + 's';

    petal.style.fontSize = (10 + Math.random() * 8) + 'px';

  }
}

// ==================== 结局判定 ====================
function ending_check(choice) {
  clearText();
  
  const highAff = Object.entries(state.affection).filter(([k, v]) => v >= 61);
  
  if (choice !== 'none' && state.affection[choice] >= 61) {
    showEnding(choice, state.affection[choice] >= 81 ? 'HE' : 'BE');
    return;
  }
  
  if (highAff.length >= 2) {
    showEnding('harem', 'HE');
    return;
  }
  
  if (highAff.length === 1) {
    showEnding(highAff[0][0], highAff[0][1] >= 81 ? 'HE' : 'BE');
    return;
  }
  
  showEnding('alone', 'BE');
}
