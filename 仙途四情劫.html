<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仙途·四情劫</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
  background: #0a0a12;
  color: #e8e0d0;
  min-height: 100vh;
  overflow: hidden;
}

/* 背景层 */
#bg-layer {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at 50% 30%, #1a1428 0%, #0a0a12 60%, #050508 100%);
  z-index: 0;
  transition: background 1.5s ease;
}
#bg-layer.chapter1 { background: radial-gradient(ellipse at 50% 30%, #1a2a1a 0%, #0a1a0a 60%, #050a05 100%); }
#bg-layer.chapter2 { background: radial-gradient(ellipse at 50% 30%, #2a1a1a 0%, #1a0a0a 60%, #0a0505 100%); }
#bg-layer.chapter3 { background: radial-gradient(ellipse at 50% 30%, #2a1a2a 0%, #1a0a1a 60%, #0a050a 100%); }
#bg-layer.chapter4 { background: radial-gradient(ellipse at 50% 30%, #1a1a2a 0%, #0a0a1a 60%, #05050a 100%); }
#bg-layer.chapter5 { background: radial-gradient(ellipse at 50% 30%, #2a2a1a 0%, #1a1a0a 60%, #0a0a05 100%); }

/* 星光粒子 */
.star {
  position: fixed;
  width: 2px; height: 2px;
  background: #fff;
  border-radius: 50%;
  opacity: 0.3;
  animation: twinkle 3s infinite;
  z-index: 1;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.1; }
  50% { opacity: 0.6; }
}

/* 主容器 */
#game {
  position: relative;
  z-index: 10;
  max-width: 900px;
  margin: 0 auto;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 20px;
}

/* 状态栏 */
#status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  background: rgba(20, 15, 30, 0.8);
  border: 1px solid rgba(180, 150, 100, 0.2);
  border-radius: 8px;
  backdrop-filter: blur(10px);
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 10px;
}
#chapter-title {
  font-size: 14px;
  color: #b8a070;
  letter-spacing: 3px;
}
#affection-panel {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}
.aff-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
}
.aff-name { color: #a09070; }
.aff-bar {
  width: 60px;
  height: 6px;
  background: rgba(255,255,255,0.1);
  border-radius: 3px;
  overflow: hidden;
}
.aff-fill {
  height: 100%;
  width: 0%;
  border-radius: 3px;
  transition: width 0.6s ease;
}
.aff-fill.xieyunzhou { background: linear-gradient(90deg, #e8c8a0, #f0e0c0); }
.aff-fill.xiejiuyuan { background: linear-gradient(90deg, #c04040, #e06060); }
.aff-fill.rongzhao { background: linear-gradient(90deg, #6090c0, #90c0e0); }
.aff-fill.sumoyuan { background: linear-gradient(90deg, #b090d0, #d0b0e0); }
.aff-value { color: #d0c0a0; min-width: 20px; text-align: right; }

/* 文本区域 */
#text-area {
  flex: 1;
  overflow-y: auto;
  padding: 30px;
  background: rgba(15, 12, 25, 0.7);
  border: 1px solid rgba(180, 150, 100, 0.15);
  border-radius: 12px;
  backdrop-filter: blur(8px);
  margin-bottom: 16px;
  line-height: 2;
  font-size: 16px;
  scroll-behavior: smooth;
}
#text-area::-webkit-scrollbar { width: 4px; }
#text-area::-webkit-scrollbar-thumb { background: rgba(180,150,100,0.3); border-radius: 2px; }

.text-line {
  margin-bottom: 16px;
  animation: fadeIn 0.8s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.narration { color: #b0a890; font-style: italic; }
.dialogue { color: #e8e0d0; }
.dialogue .speaker { color: #d0b080; font-weight: bold; margin-right: 8px; }
.dialogue.xieyunzhou .speaker { color: #f0d0a0; }
.dialogue.xiejiuyuan .speaker { color: #e06060; }
.dialogue.rongzhao .speaker { color: #90c0e0; }
.dialogue.sumoyuan .speaker { color: #d0b0e0; }
.thought { color: #9080a0; font-style: italic; }
.highlight { color: #f0d080; font-weight: bold; }

/* 选项区域 */
#choices {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: 10px;
}
.choice-btn {
  padding: 16px 24px;
  background: rgba(25, 20, 40, 0.8);
  border: 1px solid rgba(180, 150, 100, 0.25);
  border-radius: 10px;
  color: #d8d0c0;
  font-family: inherit;
  font-size: 15px;
  text-align: left;
  cursor: pointer;
  transition: all 0.3s ease;
  backdrop-filter: blur(6px);
  position: relative;
  overflow: hidden;
}
.choice-btn:hover {
  background: rgba(40, 32, 55, 0.9);
  border-color: rgba(220, 190, 130, 0.5);
  color: #f0e8d8;
  transform: translateX(6px);
  box-shadow: 0 4px 20px rgba(180, 150, 100, 0.15);
}
.choice-btn::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, #d0b080, #a08050);
  opacity: 0;
  transition: opacity 0.3s;
}
.choice-btn:hover::before { opacity: 1; }

/* 开始界面 */
#start-screen {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at 50% 40%, #1a1428 0%, #0a0a12 70%);
  text-align: center;
  padding: 20px;
}
#start-screen h1 {
  font-size: clamp(36px, 8vw, 72px);
  color: #e8d0a0;
  letter-spacing: 12px;
  margin-bottom: 10px;
  text-shadow: 0 0 40px rgba(220, 190, 130, 0.3);
  font-weight: 400;
}
#start-screen .subtitle {
  font-size: 16px;
  color: #a09070;
  letter-spacing: 6px;
  margin-bottom: 50px;
}
#start-screen .quote {
  font-size: 14px;
  color: #807060;
  font-style: italic;
  margin-bottom: 50px;
  max-width: 500px;
  line-height: 2;
}
.start-btn {
  padding: 16px 60px;
  background: transparent;
  border: 1px solid rgba(200, 170, 110, 0.5);
  border-radius: 40px;
  color: #e0d0b0;
  font-family: inherit;
  font-size: 18px;
  letter-spacing: 6px;
  cursor: pointer;
  transition: all 0.4s ease;
}
.start-btn:hover {
  background: rgba(200, 170, 110, 0.1);
  box-shadow: 0 0 30px rgba(200, 170, 110, 0.2);
  letter-spacing: 10px;
}

/* 结局界面 */
#ending-screen {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at 50% 40%, #1a1428 0%, #0a0a12 70%);
  text-align: center;
  padding: 40px 20px;
  overflow-y: auto;
}
#ending-screen h2 {
  font-size: clamp(28px, 6vw, 48px);
  color: #e8d0a0;
  letter-spacing: 8px;
  margin-bottom: 30px;
  text-shadow: 0 0 30px rgba(220, 190, 130, 0.3);
}
#ending-screen .ending-text {
  font-size: 16px;
  color: #c0b8a8;
  line-height: 2.2;
  max-width: 600px;
  margin-bottom: 40px;
  text-align: left;
}
#ending-screen .ending-text p { margin-bottom: 14px; }
.restart-btn {
  padding: 14px 50px;
  background: transparent;
  border: 1px solid rgba(200, 170, 110, 0.5);
  border-radius: 40px;
  color: #e0d0b0;
  font-family: inherit;
  font-size: 16px;
  letter-spacing: 4px;
  cursor: pointer;
  transition: all 0.4s ease;
}
.restart-btn:hover {
  background: rgba(200, 170, 110, 0.1);
  box-shadow: 0 0 30px rgba(200, 170, 110, 0.2);
}

/* 好感度提示 */
.aff-popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 12px 28px;
  background: rgba(20, 15, 30, 0.95);
  border: 1px solid rgba(200, 170, 110, 0.4);
  border-radius: 30px;
  color: #f0d080;
  font-size: 16px;
  z-index: 150;
  animation: popupFade 2s ease forwards;
  pointer-events: none;
}
@keyframes popupFade {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
  20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -60%) scale(1); }
}

@media (max-width: 600px) {
  #game { padding: 10px; }
  #text-area { padding: 20px; font-size: 15px; }
  .choice-btn { padding: 14px 18px; font-size: 14px; }
  #status-bar { padding: 10px 14px; }
  .aff-bar { width: 40px; }
}
</style>
</head>
<body>

<div id="bg-layer"></div>

<!-- 开始界面 -->
<div id="start-screen">
  <h1>仙途</h1>
  <div class="subtitle">四 情 劫</div>
  <div class="quote">
    正道非正，魔道非恶。<br>
    妖亦有情，仙亦有私。<br>
    你，会选谁？
  </div>
  <button class="start-btn" onclick="startGame()">开 始</button>
</div>

<!-- 游戏主界面 -->
<div id="game" style="display:none;">
  <div id="status-bar">
    <div id="chapter-title">第一章 · 初入昆仑</div>
    <div id="affection-panel">
      <div class="aff-item">
        <span class="aff-name">云舟</span>
        <div class="aff-bar"><div class="aff-fill xieyunzhou" id="aff-xieyunzhou"></div></div>
        <span class="aff-value" id="val-xieyunzhou">0</span>
      </div>
      <div class="aff-item">
        <span class="aff-name">九渊</span>
        <div class="aff-bar"><div class="aff-fill xiejiuyuan" id="aff-xiejiuyuan"></div></div>
        <span class="aff-value" id="val-xiejiuyuan">0</span>
      </div>
      <div class="aff-item">
        <span class="aff-name">容昭</span>
        <div class="aff-bar"><div class="aff-fill rongzhao" id="aff-rongzhao"></div></div>
        <span class="aff-value" id="val-rongzhao">0</span>
      </div>
      <div class="aff-item">
        <span class="aff-name">墨渊</span>
        <div class="aff-bar"><div class="aff-fill sumoyuan" id="aff-sumoyuan"></div></div>
        <span class="aff-value" id="val-sumoyuan">0</span>
      </div>
    </div>
  </div>
  <div id="text-area"></div>
  <div id="choices"></div>
</div>

<!-- 结局界面 -->
<div id="ending-screen">
  <h2 id="ending-title"></h2>
  <div class="ending-text" id="ending-text"></div>
  <button class="restart-btn" onclick="restartGame()">重 新 开 始</button>
</div>

<script>
// ==================== 游戏状态 ====================
let state = {
  affection: { xieyunzhou: 0, xiejiuyuan: 0, rongzhao: 0, sumoyuan: 0 },
  flags: {},
  chapter: 1
};

// ==================== 好感度显示 ====================
function updateAffectionUI() {
  const names = ['xieyunzhou', 'xiejiuyuan', 'rongzhao', 'sumoyuan'];
  names.forEach(n => {
    const val = state.affection[n];
    document.getElementById('aff-' + n).style.width = Math.min(val, 100) + '%';
    document.getElementById('val-' + n).textContent = val;
  });
}

function changeAffection(name, amount) {
  state.affection[name] = Math.max(0, Math.min(100, state.affection[name] + amount));
  updateAffectionUI();
  if (amount > 0) {
    const labels = { xieyunzhou: '谢云舟', xiejiuyuan: '谢九渊', rongzhao: '容昭', sumoyuan: '苏墨渊' };
    showAffPopup(labels[name] + ' 好感 +' + amount);
  }
}

function showAffPopup(text) {
  const popup = document.createElement('div');
  popup.className = 'aff-popup';
  popup.textContent = text;
  document.body.appendChild(popup);
  setTimeout(() => popup.remove(), 2000);
}

// ==================== 文本渲染 ====================
function clearText() {
  document.getElementById('text-area').innerHTML = '';
  document.getElementById('choices').innerHTML = '';
}

function addText(html, className = '') {
  const area = document.getElementById('text-area');
  const div = document.createElement('div');
  div.className = 'text-line ' + className;
  div.innerHTML = html;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function addNarration(text) {
  addText(text, 'narration');
}

function addDialogue(speaker, text, charClass = '') {
  addText(`<span class="speaker">${speaker}</span>「${text}」`, 'dialogue ' + charClass);
}

function addThought(text) {
  addText('（' + text + '）', 'thought');
}

// ==================== 选项渲染 ====================
function showChoices(choices) {
  const container = document.getElementById('choices');
  container.innerHTML = '';
  choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.text;
    btn.onclick = () => {
      container.innerHTML = '';
      // 显示选择结果
      if (c.result) addNarration('▸ ' + c.result);
      if (c.effect) c.effect();
      // 延迟后进入下一场景
      setTimeout(() => { c.next(); }, c.delay || 800);
    };
    container.appendChild(btn);
  });
}

// ==================== 背景切换 ====================
function setChapterBg(ch) {
  const bg = document.getElementById('bg-layer');
  bg.className = '';
  if (ch >= 1 && ch <= 5) bg.classList.add('chapter' + ch);
  document.getElementById('chapter-title').textContent = 
    ['', '第一章 · 初入昆仑', '第二章 · 宗门禁忌', '第三章 · 入世历练', '第四章 · 秘境迷渊', '第五章 · 三界动荡'][ch] || '';
}

// ==================== 创建星光 ====================
function createStars() {
  for (let i = 0; i < 40; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    star.style.width = star.style.height = (Math.random() * 2 + 1) + 'px';
    document.body.appendChild(star);
  }
}

// ==================== 场景流程 ====================

// ---------- 序章 ----------
function scene_prologue() {
  clearText();
  setChapterBg(1);
  addNarration('昆仑仙宗，仙魔同源，立宗万年。');
  addNarration('七峰并立，仙道四峰主修灵力，魔道两峰主修魔气。唯有东峰——仙魔同修，不偏不倚。');
  addNarration('然而三百年前一场变故，东峰没落，沦为七峰之末。');
  addNarration('');
  addNarration('你叫——');
  
  const area = document.getElementById('text-area');
  const div = document.createElement('div');
  div.className = 'text-line';
  div.innerHTML = '<input id="name-input" style="background:transparent;border:none;border-bottom:1px solid rgba(200,170,110,0.5);color:#f0d080;font-family:inherit;font-size:18px;padding:4px 8px;outline:none;width:140px;text-align:center;" placeholder="输入你的名字" maxlength="6">';
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  
  const container = document.getElementById('choices');
  container.innerHTML = '';
  const btn = document.createElement('button');
  btn.className = 'choice-btn';
  btn.textContent = '确 定';
  btn.onclick = () => {
    const name = document.getElementById('name-input').value.trim() || '无名';
    state.playerName = name;
    scene_chapter1_intro();
  };
  container.appendChild(btn);
}

// ---------- 第一章：初入昆仑 ----------
function scene_chapter1_intro() {
  clearText();
  setChapterBg(1);
  addNarration(`你叫${state.playerName}，凡间孤女，被昆仑仙宗下山收徒的执事顺手带回。`);
  addNarration('测灵根那天，你伸出测灵石的手在抖。');
  addNarration('测灵石亮了——很暗，很弱。');
  addNarration('伪灵根。仙道修炼速度极慢，几无结丹可能。');
  addNarration('');
  addNarration('仙道四峰的峰主看了一眼，纷纷摇头。');
  addNarration('最后，你被分到了最冷清的东峰。');
  addNarration('');
  addNarration('东峰之上，桃树成林，却无人打理。你走着走着，迷了路。');
  
  setTimeout(() => {
    addNarration('');
    addNarration('桃花深处，一把月白色的伞，撑开了。');
    addDialogue('???', '你是新来的师妹？', 'xieyunzhou');
    addNarration('你抬头，看到一个穿着月白道袍的年轻男子。眉眼温和，笑起来像三月春风。');
    addDialogue('谢云舟', '我是东峰大弟子，谢云舟。你迷路了？', 'xieyunzhou');
    
    showChoices([
      {
        text: '「对不起，我迷路了……给你添麻烦了。」',
        result: '他愣了一下。三百年来，第一个对他说「对不起」的人。',
        effect: () => changeAffection('xieyunzhou', 5),
        next: scene_c1_choice2
      },
      {
        text: '「你是大师兄？那以后请多指教！」',
        result: '他笑了笑，桃花眼弯弯的。',
        effect: () => changeAffection('xieyunzhou', 3),
        next: scene_c1_choice2
      },
      {
        text: '「我自己能找到路，不用麻烦你。」',
        result: '他收起伞，看了你很久。',
        effect: () => changeAffection('xieyunzhou', 2),
        next: scene_c1_choice2
      }
    ]);
  }, 1500);
}

function scene_c1_choice2() {
  addNarration('');
  addNarration('他没有再多说什么，只是蹲下身，背对着你。');
  addDialogue('谢云舟', '上来吧。东峰的路不好走，天黑之前到不了。', 'xieyunzhou');
  addNarration('你趴在他背上。他的背很暖，走得很慢。');
  addNarration('你困了。迷迷糊糊之间，你感觉他绕了很远的路。');
  addNarration('');
  addNarration('到了住处，他把你放下，替你盖好被子。');
  addDialogue('谢云舟', '明天带你去见师尊。早点睡。', 'xieyunzhou');
  addNarration('他转身离开。走到门口，又停下。');
  addDialogue('谢云舟', '……你叫什么名字？', 'xieyunzhou');
  addNarration(`你报了名字。他点了点头，推门走了。`);
  addNarration('');
  addNarration('你不知道的是——他走到拐角处，靠着墙站了很久。');
  addNarration('他摸着自己的耳朵。是烫的。');
  
  setTimeout(() => scene_c1_rongzhao(), 2000);
}

function scene_c1_rongzhao() {
  clearText();
  addNarration('第二天清晨，谢云舟带你去了东峰之巅。');
  addNarration('一座清冷的殿宇立在峰顶，殿门半掩，里面传来翻书的声音。');
  addNarration('你推门进去。');
  addNarration('');
  addNarration('殿内，一个白色长发的男人坐在案前。他的眼睛是冰蓝色的，像结了冰的湖。');
  addNarration('他没有抬头。');
  addDialogue('谢云舟', '师尊，这是新入门的师妹。', 'xieyunzhou');
  addNarration('他翻了一页书。');
  addDialogue('容昭', '嗯。', 'rongzhao');
  addNarration('谢云舟退下了。殿内只剩你和他。');
  addNarration('他终于抬头，看了你一眼。');
  addDialogue('容昭', '伸出手。', 'rongzhao');
  addNarration('你伸出测灵石。他指尖点在测灵石上，灵力探入。');
  addNarration('片刻，他收回手。');
  addDialogue('容昭', '伪灵根。……能修。', 'rongzhao');
  addNarration('声音很轻，像在说给自己听。');
  addNarration('');
  addNarration('然后他又低下头看书，像是你从未来过。');
  addNarration('你站在殿中，不知道该走还是该留。');
  addNarration('你鼓起勇气，问了一句——');
  
  showChoices([
    {
      text: '「师尊，我……还能留在东峰吗？」',
      result: '他翻书的手停了一瞬。三千年来，所有人都在问他「能不能变强」，只有你问「能不能留下」。',
      effect: () => changeAffection('rongzhao', 8),
      next: scene_c1_end
    },
    {
      text: '「师尊，我会努力的，不会给您丢脸。」',
      result: '他没有抬头，只是翻了一页书。但你注意到，他翻的那一页，和上一页是同一页。',
      effect: () => changeAffection('rongzhao', 4),
      next: scene_c1_end
    },
    {

// ==================== 结局判定 ====================
function ending_check(choice) {
  clearText();
  
  // 检查有多少人好感度 >= 61
  const highAff = Object.entries(state.affection).filter(([k, v]) => v >= 61);
  
  // 如果选择的人好感度 >= 61，进入该角色结局
  if (choice !== 'none' && state.affection[choice] >= 61) {
    const names = { xieyunzhou: '谢云舟', xiejiuyuan: '谢九渊', rongzhao: '容昭', sumoyuan: '苏墨渊' };
    showEnding(choice, state.affection[choice] >= 81 ? 'HE' : 'BE');
    return;
  }
  
  // 如果选择的人好感度 < 61，但有人 >= 61
  if (highAff.length >= 2) {
    showEnding('harem', 'HE');
    return;
  }
  
  if (highAff.length === 1) {
    showEnding(highAff[0][0], highAff[0][1] >= 81 ? 'HE' : 'BE');
    return;
  }
  
  // 无人好感度 >= 61
  showEnding('alone', 'BE');
}

      <p>“师妹——”</p>
      <p>“……”</p>
      <p>“……”</p>
      <p>你没有回头。</p>
      <p>多年后，东峰的桃树枯了。魔宫的茶凉了。冰室的镜子碎了。青丘的桃花谢了。</p>
      <p>但有人说，在某个无名山上，看到过一个白衣女子。她在那里种了一片桃林，养了一只白狐，手里总是拿着一本剑谱。</p>
      <p>剑谱的最后一页，写着四个名字。</p>
      <p>都被划掉了。</p>
      <p style="color:#f0d080;margin-top:20px;">—— 大道无情，太上忘情。她选了大道，他们选了疯魔。</p>
    `;
  }
  
  title.textContent = titleStr;
  text.innerHTML = textStr;
  screen.style.display = 'flex';
}

// ==================== 开始/重启 ====================
function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game').style.display = 'flex';
  document.getElementById('ending-screen').style.display = 'none';
  scene_prologue();
}

function restartGame() {
  state = {
    affection: { xieyunzhou: 0, xiejiuyuan: 0, rongzhao: 0, sumoyuan: 0 },
    flags: {},
    chapter: 1,
    playerName: ''
  };
  updateAffectionUI();
  document.getElementById('ending-screen').style.display = 'none';
  document.getElementById('start-screen').style.display = 'flex';
  document.getElementById('game').style.display = 'none';
}

// ==================== 初始化 ====================
createStars();
</script>
