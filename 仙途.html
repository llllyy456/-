<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>仙途</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
button, input { touch-action: manipulation; }
body {
  font-family: "Noto Serif SC", "Songti SC", "STSong", "Microsoft YaHei", serif;
  background: #050308;
  color: #e8e0d0;
  min-height: 100vh;
  overflow: hidden;
  position: relative;
}

/* ==================== 背景层 ==================== */
#bg-layer {
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(ellipse at 50% 20%, rgba(40, 30, 60, 0.4) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 30%, #1a1428 0%, #0a0a12 60%, #050508 100%);
  z-index: 0;
  transition: background 1.5s ease;
}
#bg-layer.chapter1 { 
  background: 
    radial-gradient(ellipse at 50% 20%, rgba(60, 100, 60, 0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 30%, #1a2a1a 0%, #0a1a0a 60%, #050a05 100%);
}
#bg-layer.chapter2 { 
  background: 
    radial-gradient(ellipse at 50% 20%, rgba(120, 50, 50, 0.18) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 30%, #2a1a1a 0%, #1a0a0a 60%, #0a0505 100%);
}
#bg-layer.chapter3 { 
  background: 
    radial-gradient(ellipse at 50% 20%, rgba(120, 50, 120, 0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 30%, #2a1a2a 0%, #1a0a1a 60%, #0a050a 100%);
}
#bg-layer.chapter4 { 
  background: 
    radial-gradient(ellipse at 50% 20%, rgba(50, 80, 140, 0.18) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 30%, #1a1a2a 0%, #0a0a1a 60%, #05050a 100%);
}
#bg-layer.chapter5 { 
  background: 
    radial-gradient(ellipse at 50% 20%, rgba(140, 120, 50, 0.2) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 30%, #2a2a1a 0%, #1a1a0a 60%, #0a0a05 100%);
}

/* 飘落花瓣 */
.petal {
  position: fixed;
  z-index: 2;
  pointer-events: none;
  opacity: 0;
  font-size: 14px;
  color: rgba(240, 200, 200, 0.5);
  animation: petalFall 12s linear infinite;
  text-shadow: 0 0 8px rgba(240, 180, 200, 0.4);
}
@keyframes petalFall {
  0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
  10% { opacity: 0.7; }
  90% { opacity: 0.7; }
  100% { transform: translateY(110vh) translateX(80px) rotate(360deg); opacity: 0; }
}

/* 星辰 */
.star {
  position: fixed;
  width: 2px; height: 2px;
  background: #fff;
  border-radius: 50%;
  opacity: 0.3;
  animation: twinkle 3s infinite;
  z-index: 1;
  box-shadow: 0 0 4px rgba(255,255,255,0.6);
}
@keyframes twinkle {
  0%, 100% { opacity: 0.1; transform: scale(0.8); }
  50% { opacity: 0.8; transform: scale(1.2); }
}

/* ==================== 游戏主体 ==================== */
#game {
  position: relative;
  z-index: 10;
  max-width: 920px;
  margin: 0 auto;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 18px 20px;
  padding-bottom: calc(18px + env(safe-area-inset-bottom));
}

/* 状态栏 */
#status-bar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px 22px 14px;
  background: linear-gradient(180deg, rgba(25, 18, 38, 0.88), rgba(15, 10, 25, 0.88));
  border: 1px solid rgba(180, 150, 100, 0.3);
  border-radius: 10px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  margin-bottom: 14px;
  position: relative;
  box-shadow:
    0 4px 20px rgba(0,0,0,0.4),
    inset 0 1px 0 rgba(220, 190, 130, 0.08);
}
#status-bar::before, #status-bar::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 6px;
  height: 6px;
  background: #d0b080;
  border-radius: 50%;
  transform: translateY(-50%);
  box-shadow: 0 0 8px rgba(208, 176, 128, 0.6);
}
#status-bar::before { left: 8px; }
#status-bar::after { right: 8px; }

/* 主线：修炼进度条区（顶部常驻） */
.cult-main {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  padding: 4px 12px 0;
}
.cult-main .realm-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  background: linear-gradient(135deg, rgba(200,170,110,0.18), rgba(160,130,80,0.08));
  border: 1px solid rgba(220,190,130,0.4);
  border-radius: 20px;
  font-size: 13px;
  color: #f0e0c0;
  letter-spacing: 2px;
  white-space: nowrap;
  box-shadow: 0 0 10px rgba(220,190,130,0.18);
}
.cult-main .realm-tag .rank {
  font-size: 11px;
  color: #a09070;
  border-left: 1px solid rgba(200,170,110,0.35);
  padding-left: 8px;
  margin-left: 4px;
  letter-spacing: 1px;
}
.cult-main .lingli-bar-wrap {
  flex: 1;
  min-width: 180px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.cult-main .lingli-bar {
  flex: 1;
  height: 12px;
  background: rgba(255,255,255,0.08);
  border-radius: 6px;
  overflow: hidden;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
  position: relative;
}
.cult-main .lingli-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #6090c0, #90c0e0, #b0e0f0);
  border-radius: 6px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 0 10px rgba(144, 192, 224, 0.6);
  position: relative;
}
.cult-main .lingli-fill::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  animation: shimmer 2.5s linear infinite;
}
.cult-main .lingli-text {
  font-size: 12px;
  color: #c0d0e0;
  font-variant-numeric: tabular-nums;
  letter-spacing: 1px;
  white-space: nowrap;
}
.cult-main .attr-chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.cult-main .chip {
  font-size: 11px;
  color: #b0a888;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(180,150,100,0.2);
  border-radius: 12px;
  padding: 3px 9px;
  letter-spacing: 1px;
  white-space: nowrap;
}
.cult-main .chip b { color: #f0e0c0; font-weight: 500; }

/* 副线：好感度区（次要栏） */
.cult-sub {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding: 0 12px;
  border-top: 1px dashed rgba(180,150,100,0.18);
  padding-top: 8px;
}
#chapter-title {
  font-size: 13px;
  color: #a09070;
  letter-spacing: 3px;
  font-weight: 500;
  padding-left: 14px;
  opacity: 0.85;
}
#affection-panel {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  padding-right: 14px;
}
.aff-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  transition: transform 0.3s ease;
  opacity: 0.92;
}
.aff-item:hover { transform: translateY(-2px); opacity: 1; }
.aff-name {
  color: #a09070;
  letter-spacing: 1px;
}
.aff-bar {
  width: 54px;
  height: 6px;
  background: rgba(255,255,255,0.08);
  border-radius: 4px;
  overflow: hidden;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
  position: relative;
}
.aff-fill {
  height: 100%;
  width: 0%;
  border-radius: 4px;
  transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  box-shadow: 0 0 6px currentColor;
}
.aff-fill::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  animation: shimmer 2.5s linear infinite;
}
@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(200%); }
}
.aff-fill.shenhuaizhou { background: linear-gradient(90deg, #e8c8a0, #f0e0c0); color: #f0d0a0; }
.aff-fill.lihanyuan { background: linear-gradient(90deg, #c04040, #e06060); color: #e06060; }
.aff-fill.rongzhao { background: linear-gradient(90deg, #6090c0, #90c0e0); color: #90c0e0; }
.aff-fill.muchangli { background: linear-gradient(90deg, #b090d0, #d0b0e0); color: #d0b0e0; }
.aff-value {
  color: #d0c0a0;
  min-width: 22px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* 文本区 */
#text-area {
  flex: 1;
  overflow-y: auto;
  padding: 36px 40px;
  background: 
    linear-gradient(180deg, rgba(20, 15, 32, 0.75), rgba(12, 8, 22, 0.75));
  border: 1px solid rgba(180, 150, 100, 0.2);
  border-radius: 14px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  margin-bottom: 14px;
  line-height: 2.1;
  font-size: 16px;
  scroll-behavior: smooth;
  position: relative;
  box-shadow: 
    0 8px 32px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(220, 190, 130, 0.06);
}
/* 四角装饰 */
#text-area::before, #text-area::after {
  content: "";
  position: absolute;
  width: 24px;
  height: 24px;
  border: 1px solid rgba(200, 170, 110, 0.4);
  pointer-events: none;
}
#text-area::before { top: 8px; left: 8px; border-right: none; border-bottom: none; }
#text-area::after { bottom: 8px; right: 8px; border-left: none; border-top: none; }

#text-area::-webkit-scrollbar { width: 6px; }
#text-area::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
#text-area::-webkit-scrollbar-thumb { 
  background: linear-gradient(180deg, rgba(208, 176, 128, 0.5), rgba(160, 128, 80, 0.5));
  border-radius: 3px; 
}
#text-area::-webkit-scrollbar-thumb:hover { 
  background: linear-gradient(180deg, rgba(208, 176, 128, 0.7), rgba(160, 128, 80, 0.7));
}

.text-line {
  margin-bottom: 18px;
  animation: fadeIn 0.9s cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); filter: blur(2px); }
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}

.narration { color: #b0a890; font-style: italic; }
.dialogue { color: #e8e0d0; }
.dialogue .speaker { 
  color: #d0b080; 
  font-weight: bold; 
  margin-right: 10px;
  text-shadow: 0 0 6px currentColor;
}
.dialogue.shenhuaizhou .speaker { color: #f0d0a0; }
.dialogue.lihanyuan .speaker { color: #e06060; }
.dialogue.rongzhao .speaker { color: #90c0e0; }
.dialogue.muchangli .speaker { color: #d0b0e0; }
.thought { color: #9080a0; font-style: italic; }
.highlight { color: #f0d080; font-weight: bold; text-shadow: 0 0 8px rgba(240, 208, 128, 0.4); }

/* 选项按钮 */
#choices {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: 10px;
}
.choice-btn {
  padding: 16px 26px 16px 30px;
  background: linear-gradient(90deg, rgba(25, 20, 40, 0.85), rgba(18, 14, 30, 0.85));
  border: 1px solid rgba(180, 150, 100, 0.3);
  border-radius: 10px;
  color: #d8d0c0;
  font-family: inherit;
  font-size: 15px;
  line-height: 1.7;
  text-align: left;
  cursor: pointer;
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  position: relative;
  overflow: hidden;
  letter-spacing: 0.5px;
}
.choice-btn::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, #f0d080, #c0a060, #806030);
  opacity: 0;
  transition: opacity 0.3s;
  box-shadow: 0 0 10px rgba(240, 208, 128, 0.5);
}
.choice-btn::after {
  content: "";
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(240, 208, 128, 0.1), transparent);
  transition: left 0.6s ease;
}
.choice-btn:hover {
  background: linear-gradient(90deg, rgba(45, 35, 60, 0.95), rgba(30, 22, 45, 0.95));
  border-color: rgba(240, 208, 128, 0.6);
  color: #f0e8d8;
  transform: translateX(8px);
  box-shadow: 
    0 6px 24px rgba(0,0,0,0.5),
    0 0 20px rgba(180, 150, 100, 0.2);
}
.choice-btn:hover::before { opacity: 1; }
.choice-btn:hover::after { left: 100%; }
.choice-btn:active { transform: translateX(4px) scale(0.99); }

/* ==================== 开始屏 ==================== */
#start-screen {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: 
    radial-gradient(ellipse at 50% 40%, rgba(40, 30, 60, 0.4) 0%, transparent 60%),
    radial-gradient(ellipse at 50% 40%, #1a1428 0%, #0a0a12 70%);
  text-align: center;
  padding: 20px;
}
#start-screen::before {
  content: "";
  position: absolute;
  inset: 40px;
  border: 1px solid rgba(180, 150, 100, 0.15);
  border-radius: 8px;
  pointer-events: none;
}
#start-screen::after {
  content: "";
  position: absolute;
  inset: 46px;
  border: 1px solid rgba(180, 150, 100, 0.08);
  border-radius: 6px;
  pointer-events: none;
}
#start-screen h1 {
  font-size: clamp(40px, 9vw, 80px);
  color: #e8d0a0;
  letter-spacing: 16px;
  margin-bottom: 16px;
  text-shadow: 
    0 0 40px rgba(220, 190, 130, 0.4),
    0 0 80px rgba(220, 190, 130, 0.2);
  font-weight: 400;
  position: relative;
  z-index: 1;
  animation: titleGlow 4s ease-in-out infinite;
}
@keyframes titleGlow {
  0%, 100% { text-shadow: 0 0 40px rgba(220, 190, 130, 0.4), 0 0 80px rgba(220, 190, 130, 0.2); }
  50% { text-shadow: 0 0 50px rgba(240, 208, 128, 0.6), 0 0 100px rgba(220, 190, 130, 0.3); }
}
#start-screen .quote {
  font-size: 15px;
  color: #908070;
  font-style: italic;
  margin-bottom: 56px;
  max-width: 500px;
  line-height: 2.2;
  position: relative;
  z-index: 1;
  letter-spacing: 2px;
}
#start-screen .quote::before, 
#start-screen .quote::after {
  display: block;
  width: 60px;
  height: 1px;
  margin: 20px auto;
  background: linear-gradient(90deg, transparent, rgba(180, 150, 100, 0.4), transparent);
  content: "";
}
.start-btn {
  padding: 16px 64px;
  background: transparent;
  border: 1px solid rgba(200, 170, 110, 0.5);
  border-radius: 40px;
  color: #e0d0b0;
  font-family: inherit;
  font-size: 18px;
  letter-spacing: 8px;
  cursor: pointer;
  transition: all 0.4s ease;
  position: relative;
  z-index: 1;
  overflow: hidden;
}
.start-btn::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(240, 208, 128, 0.15), transparent 70%);
  opacity: 0;
  transition: opacity 0.4s;
}
.start-btn:hover {
  background: rgba(200, 170, 110, 0.08);
  border-color: rgba(240, 208, 128, 0.7);
  box-shadow: 
    0 0 30px rgba(200, 170, 110, 0.25),
    inset 0 0 20px rgba(200, 170, 110, 0.1);
  letter-spacing: 12px;
  color: #f0e0c0;
}
.start-btn:hover::before { opacity: 1; }

/* ==================== 结局屏 ==================== */
#ending-screen {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: 
    radial-gradient(ellipse at 50% 40%, rgba(40, 30, 60, 0.4) 0%, transparent 60%),
    radial-gradient(ellipse at 50% 40%, #1a1428 0%, #0a0a12 70%);
  text-align: center;
  padding: 50px 20px;
  overflow-y: auto;
}
#ending-screen::before {
  content: "";
  position: absolute;
  inset: 30px;
  border: 1px solid rgba(180, 150, 100, 0.2);
  border-radius: 8px;
  pointer-events: none;
}
#ending-screen h2 {
  font-size: clamp(30px, 6.5vw, 52px);
  color: #e8d0a0;
  letter-spacing: 10px;
  margin-bottom: 36px;
  text-shadow: 
    0 0 30px rgba(220, 190, 130, 0.4),
    0 0 60px rgba(220, 190, 130, 0.2);
  font-weight: 400;
  animation: titleGlow 4s ease-in-out infinite;
  position: relative;
  z-index: 1;
}
#ending-screen .ending-text {
  font-size: 16px;
  color: #c0b8a8;
  line-height: 2.3;
  max-width: 620px;
  margin-bottom: 44px;
  text-align: left;
  padding: 30px 36px;
  background: rgba(15, 12, 25, 0.5);
  border: 1px solid rgba(180, 150, 100, 0.15);
  border-radius: 10px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  position: relative;
  z-index: 1;
  box-shadow: inset 0 1px 0 rgba(220, 190, 130, 0.05);
}
#ending-screen .ending-text p { margin-bottom: 16px; }
#ending-screen .ending-text p:last-child { margin-bottom: 0; }
.restart-btn {
  padding: 14px 54px;
  background: transparent;
  border: 1px solid rgba(200, 170, 110, 0.5);
  border-radius: 40px;
  color: #e0d0b0;
  font-family: inherit;
  font-size: 16px;
  letter-spacing: 5px;
  cursor: pointer;
  transition: all 0.4s ease;
  position: relative;
  z-index: 1;
}
.restart-btn:hover {
  background: rgba(200, 170, 110, 0.1);
  border-color: rgba(240, 208, 128, 0.7);
  box-shadow: 
    0 0 30px rgba(200, 170, 110, 0.25),
    inset 0 0 20px rgba(200, 170, 110, 0.1);
  color: #f0e0c0;
  letter-spacing: 8px;
}

/* ==================== 好感度弹出 ==================== */
.aff-popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 14px 32px;
  background: linear-gradient(135deg, rgba(25, 18, 38, 0.95), rgba(15, 10, 25, 0.95));
  border: 1px solid rgba(240, 208, 128, 0.5);
  border-radius: 30px;
  color: #f0d080;
  font-size: 16px;
  letter-spacing: 2px;
  z-index: 150;
  animation: popupFade 2s ease forwards;
  pointer-events: none;
  box-shadow: 
    0 0 30px rgba(240, 208, 128, 0.3),
    inset 0 1px 0 rgba(240, 208, 128, 0.2);
  text-shadow: 0 0 8px rgba(240, 208, 128, 0.5);
}
@keyframes popupFade {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
  20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -65%) scale(1); }
}

/* 名字输入框 */
#name-input {
  background: transparent !important;
  border: none !important;
  border-bottom: 1px solid rgba(200, 170, 110, 0.6) !important;
  color: #f0d080 !important;
  font-family: inherit !important;
  font-size: 18px !important;
  padding: 6px 10px !important;
  outline: none !important;
  width: 160px !important;
  text-align: center !important;
  letter-spacing: 2px;
  text-shadow: 0 0 8px rgba(240, 208, 128, 0.3);
  transition: all 0.3s;
}
#name-input:focus {
  border-bottom-color: rgba(240, 208, 128, 0.9) !important;
  box-shadow: 0 4px 12px -6px rgba(240, 208, 128, 0.5);
}
#name-input::placeholder { color: rgba(160, 144, 112, 0.5); }

/* 修仙按钮 */
#cult-btn {
  padding: 6px 14px;
  background: linear-gradient(135deg, rgba(40, 30, 60, 0.9), rgba(20, 14, 35, 0.9));
  border: 1px solid rgba(200, 170, 110, 0.5);
  border-radius: 20px;
  color: #e0d0b0;
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 2px;
  margin-left: 8px;
}
#cult-btn:hover {
  background: rgba(200, 170, 110, 0.15);
  box-shadow: 0 0 16px rgba(200, 170, 110, 0.3);
  color: #f0e0c0;
}

/* 修仙面板（角色玉牌） */
#cult-panel {
  position: absolute;
  top: 70px;
  right: 20px;
  width: 290px;
  max-height: calc(100vh - 100px);
  overflow-y: auto;
  padding: 18px 20px;
  background: linear-gradient(160deg, rgba(25, 18, 38, 0.96), rgba(15, 10, 25, 0.96));
  border: 1px solid rgba(200, 170, 110, 0.4);
  border-radius: 12px;
  backdrop-filter: blur(14px);

  #cult-btn {

  /* 玉牌弹层：手机端改为底部抽屉，避开顶部状态栏 */

}

/* 触摸屏：去掉 hover 位移动效（手机上会粘滞），改用按压反馈 */
@media (hover: none) {
  .choice-btn:hover {
    transform: none;

  }

  .start-btn:active, .restart-btn:active,
  .cc-pill:active, .cc-reroll:active, .cc-start-btn:active, #cult-btn:active {
    transform: scale(0.96);

<body>

// 随机抽取N个不重复的特殊体质
function rollConstitutions(n) {
  const names = Object.keys(CONSTITUTION_POOL);
  const result = [];
  const pool = names.slice();
  for (let i = 0; i < n && pool.length > 0; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    result.push(pool[idx]);
    pool.splice(idx, 1);
  }
  return result;
}

// 计算特殊体质总加成
function getConstitutionBonus() {
  const total = { lingliMul: 1, lingliMaxMul: 1, swordMul: 1, life: 0, lingliStart: 0, aff: {} };
  state.constitutions.forEach(name => {
    const c = CONSTITUTION_POOL[name];
    if (!c) return;
    total.lingliMul *= (c.lingliMul || 1);
    total.lingliMaxMul *= (c.lingliMaxMul || 1);
    total.swordMul *= (c.swordMul || 1);
    total.life += (c.life || 0);
    total.lingliStart += (c.lingliStart || 0);
    if (c.aff) {
      for (const k in c.aff) total.aff[k] = (total.aff[k] || 0) + c.aff[k];
    }
  });
  return total;
}

// 计算当前身份下的最终灵力倍率（灵根 × 主修 × 体质）
function getLingliMultiplier() {
  const lg = LINGGEN_BONUS[state.linggen] || LINGGEN_BONUS['五灵根'];
  const mc = MAINCULT_BONUS[state.mainCult] || MAINCULT_BONUS['法修'];
  const ct = getConstitutionBonus();
  return (lg.lingliMul || 1) * (mc.lingliMul || 1) * ct.lingliMul;
}
function getSwordMultiplier() {
  const mc = MAINCULT_BONUS[state.mainCult] || MAINCULT_BONUS['法修'];
  const ct = getConstitutionBonus();
  return (mc.swordMul || 1) * ct.swordMul;
}
// 灵力上限倍率（灵根 × 体质）
function getLingliMaxMultiplier() {
  const lg = LINGGEN_BONUS[state.linggen] || LINGGEN_BONUS['五灵根'];
  const ct = getConstitutionBonus();
  return (lg.lingliMaxMul || 1) * ct.lingliMaxMul;
}

// 宗门弟子等级判定（依据境界）
// 杂役弟子/外门弟子/内门弟子/真传弟子/太上长老
function rankByRealm(realmLevel) {
  if (realmLevel >= 15) return '太上长老';
  if (realmLevel >= 13) return '真传弟子';
  if (realmLevel >= 10) return '内门弟子';
  if (realmLevel >= 5)  return '外门弟子';
  return '杂役弟子';
}
// 寿元基础（随境界增长）
function lifespanByRealm(realmLevel, base) {
  // 筑基+200，金丹+500，元婴+1000，渡劫+3000，大乘+8000，飞升无尽
  const bonus = [0,0,0,0,0,0,0,0,0, 200,500,1000,3000,8000,99999];
  return base + bonus[realmLevel - 1];
}

// ==================== 修仙属性 ====================
// 当前境界灵力上限（受灵根倍率影响）
function curLingliMax() {
  const base = REALM_LINGLI_MAX[state.cultivation.realmLevel - 1];
  return Math.round(base * getLingliMaxMultiplier());
}

function addLingli(amount) {
  const c = state.cultivation;
  // 应用灵根 × 主修倍率
  const actual = Math.max(1, Math.round(amount * getLingliMultiplier()));
  const before = c.lingli;
  c.lingli = Math.min(c.lingliMax, c.lingli + actual);
  const gained = c.lingli - before;
  if (gained > 0) showAffPopup('灵力 +' + gained);
  checkBreakthrough();
  updateCultPanel();
}

function addSwordArt(amount) {
  const c = state.cultivation;
  const actual = Math.max(1, Math.round(amount * getSwordMultiplier()));
  c.swordArt += actual;
  // 剑法境界：每50熟练度提升一级
  const newLevel = Math.min(5, Math.floor(c.swordArt / 50));
  if (newLevel > SWORD_LEVELS.indexOf(c.swordArtLevel)) {
    c.swordArtLevel = SWORD_LEVELS[newLevel];
    showAffPopup('剑法突破：' + c.swordArtLevel);
  }
  showAffPopup('剑法 +' + actual);
  updateCultPanel();
}

function addYears(amount) {
  const c = state.cultivation;
  c.years += amount;
  // 骨龄随修为增长（外表年龄不变，除非突破筑基期可驻颜）
  c.boneAge += amount;
  // 寿元随修为流逝
  c.lifespan -= amount;
  if (c.lifespan <= 0) {
    c.lifespan = 0;
    // 寿元耗尽：触发大限结局（保留处理，后续可扩展）
    showAffPopup('寿元将尽！');
  }
  updateCultPanel();
}

function checkBreakthrough() {
  const c = state.cultivation;
  // 灵力满则突破
  while (c.lingli >= c.lingliMax && c.realmLevel < REALM_NAMES.length) {
    c.lingli -= c.lingliMax;
    c.realmLevel++;
    c.realm = REALM_NAMES[c.realmLevel - 1];
    c.lingliMax = curLingliMax();
    // 寿元随境界提升
    c.lifespan = lifespanByRealm(c.realmLevel, c.lifespan);
    // 弟子等级重判
    c.discipleRank = rankByRealm(c.realmLevel);
    showAffPopup('境界突破：' + c.realm + '！');

// 应用开局身份加成（在身份确认时调用）
function applyIdentityBonus() {
  const c = state.cultivation;
  const lg = LINGGEN_BONUS[state.linggen] || LINGGEN_BONUS['五灵根'];
  const mc = MAINCULT_BONUS[state.mainCult] || MAINCULT_BONUS['法修'];
  const dp = DAOPATH_BONUS[state.daoPath] || DAOPATH_BONUS['凡尘道'];
  const og = ORIGIN_BONUS[state.origin] || ORIGIN_BONUS['凡人孤女'];
  const ct = getConstitutionBonus();

  // 出身影响骨龄/寿元（体质也影响寿元）
  c.boneAge = og.boneAge;
  c.appearAge = og.boneAge;
  c.lifespan = og.lifespan + (lg.life || 0) + (dp.life || 0) + ct.life;

  // 起手灵力 / 剑法（含出身额外灵力 + 体质起手灵力）
  c.swordArt += (lg.swordStart || 0) + (mc.swordStart || 0);
  c.lingli = Math.min(c.lingliMax, c.lingli + (lg.lingliStart || 0) + (mc.lingliStart || 0) + (og.extraLingli || 0) + ct.lingliStart);
  // 灵力上限按（灵根 × 体质）倍率重算
  c.lingliMax = curLingliMax();
  c.lingli = Math.min(c.lingli, c.lingliMax);

  // 弟子等级判定（按当前境界）
  c.discipleRank = rankByRealm(c.realmLevel);

  // 修道方向起手好感
  for (const k in (dp.aff || {})) {
    state.affection[k] = (state.affection[k] || 0) + dp.aff[k];
  }
  // 特殊体质好感加成
  for (const k in ct.aff) {
    state.affection[k] = (state.affection[k] || 0) + ct.aff[k];
  }

  // 重新校验剑法境界
  const newLevel = Math.min(5, Math.floor(c.swordArt / 50));
  c.swordArtLevel = SWORD_LEVELS[newLevel];

  // 主修/辅修赋予的本命法宝/杀手锏/弱点（基础）
  applyCultEquipment();

  checkBreakthrough();
  updateAffectionUI();
  updateCultPanel();
}

// ==================== 文本渲染 ====================
function clearText() {
  document.getElementById('text-area').innerHTML = '';
  document.getElementById('choices').innerHTML = '';
}

function addText(html, className = '') {
  const area = document.getElementById('text-area');
  const div = document.createElement('div');
  div.className = 'text-line ' + className;
  div.innerHTML = html;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function addNarration(text) { addText(text, 'narration'); }
function addDialogue(speaker, text, charClass = '') {
  addText(`<span class="speaker">${speaker}</span>「${text}」`, 'dialogue ' + charClass);
}
function addThought(text) { addText('（' + text + '）', 'thought'); }

function showChoices(choices) {
  const container = document.getElementById('choices');
  container.innerHTML = '';
  choices.forEach((c) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = c.text;
    btn.onclick = () => {
      container.innerHTML = '';
      if (c.result) addNarration('▸ ' + c.result);
      if (c.effect) c.effect();
      setTimeout(() => { c.next(); }, c.delay || 800);
    };
    container.appendChild(btn);
  });
}

function setChapterBg(ch) {
  const bg = document.getElementById('bg-layer');
  bg.className = '';
  if (ch >= 1 && ch <= 5) bg.classList.add('chapter' + ch);

// ==================== 自由行动系统 ====================
// 显示自由行动菜单：根据章节解锁不同地点
function showFreeAction(nextScene, customTitle) {
  clearText();
  addNarration(customTitle || '——自由行动·行动点可用——');
  addNarration('剩余行动点：' + state.cultivation.freeActions + ' 点');
  addNarration('（每次行动消耗 1 点。主线为修炼，恋爱为支线，可自由选择去处推进剧情）');
  addNarration('');

  const places = getAvailablePlaces();

  // 无剩余行动点：直接进入下一幕
  if (state.cultivation.freeActions <= 0) {
    addNarration('你今日已无心外游，早早歇下。');
    setTimeout(() => nextScene(), 1500);
    return;
  }

  const container = document.getElementById('choices');
  container.innerHTML = '';

  places.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = '【' + p.name + '】<div style="font-size:12px;color:#a09070;margin-top:4px;">' + p.desc + '</div>';
    btn.onclick = () => {
      container.innerHTML = '';
      state.cultivation.freeActions--;
      updateCultPanel();
      p.action(() => {
        // 行动结束：若还有行动点，继续选择；否则进入下一幕
        if (state.cultivation.freeActions > 0) {
          showFreeAction(nextScene, '——还可再去一处·行动点剩余——');
        } else {
          addNarration('');
          addNarration('行动点耗尽。今日事毕。');
          setTimeout(() => nextScene(), 1500);
        }
      });
    };
    container.appendChild(btn);
  });

  // 跳过选项
  const skipBtn = document.createElement('button');
  skipBtn.className = 'choice-btn';
  skipBtn.textContent = '歇下（跳过本轮自由行动）';
  skipBtn.style.opacity = '0.7';
  skipBtn.onclick = () => {
    container.innerHTML = '';
    addNarration('你直接歇下，未外出。');
    setTimeout(() => nextScene(), 1200);
  };
  container.appendChild(skipBtn);
}

// 根据章节返回可去地点
function getAvailablePlaces() {
  const ch = state.chapter;
  const places = [];
  
  // 通用：后山练剑（解锁剑法/灵力）
  places.push({
    name: '后山练剑台',
    desc: '独自练剑，提升剑法与灵力',
    action: cb => place_practice(cb)
  });
  
  // 通用：吐纳静修（提升灵力）
  places.push({
    name: '东峰静室',
    desc: '吐纳静修，提升灵力',
    action: cb => place_meditate(cb)
  });
  
  // 第1章后解锁：桃林（沈怀舟常在）
  if (ch >= 1) {
    places.push({
      name: '桃林',
      desc: '桃花深处，大师兄常在',
      action: cb => place_peachwood(cb)
    });
  }
  
  // 第1章见容昭后解锁：书房
  if (state.flags.metRongzhao) {
    places.push({
      name: '师尊书房',
      desc: '送茶或问学',
      action: cb => place_study(cb)
    });
  }
  
  // 第2章后解锁：练剑台残痕（厉寒渊）
  if (state.flags.foundVoice) {
    places.push({
      name: '后山残痕',
      desc: '那个声音，今夜可在？',
      action: cb => place_remnant(cb)
    });
  }
  
  // 第3章后解锁：人界集市（慕长离）
  if (state.flags.metSu) {
    places.push({
      name: '人界集市',
      desc: '那个银发摊主，今日可在树下？',
      action: cb => place_market(cb)
    });
  }
  
  return places;
}

// ==================== 序章（单页药丸面板） ====================
function scene_prologue() {
  clearText();
  setChapterBg(1);

  // 默认选中
  state.linggen = '天灵根';
  state.daoPath = '苍生道';
  state.mainCult = '剑修';
  state.subCult = '采药';
  state.origin = '凡人孤女';
  state.constitutions = rollConstitutions(3);

  const area = document.getElementById('text-area');
  const container = document.getElementById('choices');
  container.innerHTML = '';

  // 名字库
  const surnames = ['沈','李','张','王','慕','林','苏','陈','柳','叶','云','顾','白','江','南'];
  const givenM = ['怀舟','寒渊','长离','清珩','砚秋','景行','怀瑾','明序','知微','望舒','朝辞','叙之'];
  const givenF = ['疏影','知夏','南乔','念卿','若棠','昭昭','予安','云晚','听雪','挽意','岁宁','昭月'];
  const genRandom = () => {
    const s = surnames[Math.floor(Math.random()*surnames.length)];
    const pool = Math.random() < 0.5 ? givenM : givenF;
    const g = pool[Math.floor(Math.random()*pool.length)];
    return s + g;
  };

  // 构造药丸按钮
  const makePill = (text, group, value, opts) => {
    const b = document.createElement('button');
    b.className = 'cc-pill' + (opts && opts.active ? ' active' : '');
    b.innerHTML = text + (opts && opts.speed ? `<span class="cc-speed">${opts.speed}</span>` : '');
    b.onclick = () => {
      // 同组单选
      document.querySelectorAll(`.cc-pill[data-group="${group}"]`).forEach(p => p.classList.remove('active'));
      b.classList.add('active');
      state[group] = value;
    };
    b.dataset.group = group;
    return b;
  };

  // 渲染某一组
  const renderGroup = (parent, title, group, pool, keyOfSpeed) => {
    const sec = document.createElement('div');
    sec.className = 'cc-section';
    const tit = document.createElement('div');
    tit.className = 'cc-section-title';
    tit.textContent = title;
    sec.appendChild(tit);
    const grid = document.createElement('div');
    grid.className = 'cc-grid';
    Object.keys(pool).forEach(k => {
      grid.appendChild(makePill(k, group, k, {
        active: state[group] === k,
        speed: keyOfSpeed ? pool[k].speed : null
      }));
    });
    sec.appendChild(grid);
    parent.appendChild(sec);
  };

  // 构建整个捏人面板
  const wrap = document.createElement('div');
  wrap.className = 'char-create';

  // 名字
  const nameSec = document.createElement('div');
  nameSec.className = 'cc-section';
  const nameTit = document.createElement('div');
  nameTit.className = 'cc-section-title';
  nameTit.textContent = '道号 / 姓名';
  nameSec.appendChild(nameTit);
  const nameRow = document.createElement('div');
  nameRow.className = 'cc-name-row';
  nameRow.innerHTML = `<input id="name-input" placeholder="输入你的名字" maxlength="6">
    <button class="cc-reroll" id="random-name-btn">随机</button>`;
  nameSec.appendChild(nameRow);
  wrap.appendChild(nameSec);

  // 修道
  renderGroup(wrap, '修道', 'daoPath', DAOPATH_BONUS, false);
  // 灵根
  renderGroup(wrap, '灵根（按修速从快到慢）', 'linggen', LINGGEN_BONUS, true);
  // 主修
  renderGroup(wrap, '主修', 'mainCult', MAINCULT_BONUS, false);
  // 辅修
  renderGroup(wrap, '辅修', 'subCult', SUBCULT_DESC, false);
  // 家世
  renderGroup(wrap, '家世背景', 'origin', ORIGIN_BONUS, false);

  // 特殊体质
  const constSec = document.createElement('div');
  constSec.className = 'cc-section';
  const constTit = document.createElement('div');
  constTit.className = 'cc-section-title';
  constTit.textContent = '特殊体质（随机3个，可重抽）';
  constSec.appendChild(constTit);
  const constGrid = document.createElement('div');
  constGrid.className = 'cc-grid';
  constGrid.id = 'constit-grid';
  constSec.appendChild(constGrid);
  const rerollBtn = document.createElement('button');
  rerollBtn.className = 'cc-reroll';
  rerollBtn.textContent = '换一批体质';
  rerollBtn.style.marginTop = '8px';
  rerollBtn.onclick = () => {
    state.constitutions = rollConstitutions(3);
    renderConstitutions();
  };
  constSec.appendChild(rerollBtn);
  wrap.appendChild(constSec);

  // 开始按钮
  const startBtn = document.createElement('button');
  startBtn.className = 'cc-start-btn';
  startBtn.textContent = '开 始 冒 险';
  startBtn.onclick = () => {
    const name = document.getElementById('name-input').value.trim() || genRandom();
    state.playerName = name;
    applyIdentityBonus();
    scene_chapter1_intro();
  };
  wrap.appendChild(startBtn);

  const tip = document.createElement('div');
  tip.className = 'cc-tip';
  tip.textContent = '※ 灵根/道向/主修/家世/体质共同决定你的修炼效率、好感倾向与资源获取。';
  wrap.appendChild(tip);

  area.appendChild(wrap);
  area.scrollTop = area.scrollHeight;

  // 绑定随机名
  document.getElementById('random-name-btn').onclick = () => {
    document.getElementById('name-input').value = genRandom();
  };

  // 渲染体质标签
  function renderConstitutions() {
    const grid = document.getElementById('constit-grid');
    grid.innerHTML = '';
    state.constitutions.forEach(name => {
      const tag = document.createElement('span');
      tag.className = 'cc-constit-tag';
      const cn = CONSTITUTION_POOL[name] ? CONSTITUTION_POOL[name].note : '';
      tag.innerHTML = `${name}<span class="cc-cn">${cn}</span>`;
      grid.appendChild(tag);
    });
  }
  renderConstitutions();
}

// ==================== 结局判定 ====================
function ending_check(choice) {
  clearText();
  
  const highAff = Object.entries(state.affection).filter(([k, v]) => v >= 61);
  
  if (choice !== 'none' && state.affection[choice] >= 61) {
    showEnding(choice, state.affection[choice] >= 81 ? 'HE' : 'BE');
    return;
  }
  
  if (highAff.length >= 2) {
    showEnding('harem', 'HE');
    return;
  }
  
  if (highAff.length === 1) {
    showEnding(highAff[0][0], highAff[0][1] >= 81 ? 'HE' : 'BE');
    return;
  }
  
  showEnding('alone', 'BE');
}
